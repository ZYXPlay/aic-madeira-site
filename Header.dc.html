<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:50;background:rgba(250,247,242,0.96);backdrop-filter:blur(8px);border-bottom:1px solid #EAE2D6">
  <div style="max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <img src="assets/logo.png" alt="A.I.C. Madeira" style="height:44px;width:auto;display:block">
      <span style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-family:'Lora',serif;font-weight:700;font-size:19px;color:#2E2A26;letter-spacing:0.01em">A.I.C. Madeira</span>
        <span style="font-family:'Karla',sans-serif;font-size:11.5px;color:#6F675E;letter-spacing:0.04em">Associação Internacional da Caridade</span>
      </span>
    </a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
          <a href="{{ item.href }}" style="font-family:'Karla',sans-serif;font-size:15px;font-weight:{{ item.weight }};color:{{ item.color }};text-decoration:none;padding:8px 12px;border-radius:8px;background:{{ item.bg }}" style-hover="color:#C0452B">{{ item.label }}</a>
        </sc-for>
        <a href="contribuicoes.html" style="font-family:'Karla',sans-serif;font-size:15px;font-weight:700;color:#FFFFFF;background:#C0452B;text-decoration:none;padding:10px 20px;border-radius:999px;margin-left:10px" style-hover="background:#A63A23">Contribuir</a>
      </nav>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="margin-left:auto;display:flex;flex-direction:column;justify-content:center;gap:5px;width:46px;height:46px;padding:11px;background:transparent;border:1.5px solid #D9CFC1;border-radius:12px;cursor:pointer" style-hover="border-color:#C0452B">
        <span style="display:block;height:2px;width:100%;background:#2E2A26;border-radius:2px;transition:transform 0.2s;transform:{{ bar1Transform }}"></span>
        <span style="display:block;height:2px;width:100%;background:#2E2A26;border-radius:2px;transition:opacity 0.2s;opacity:{{ bar2Opacity }}"></span>
        <span style="display:block;height:2px;width:100%;background:#2E2A26;border-radius:2px;transition:transform 0.2s;transform:{{ bar3Transform }}"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid #EAE2D6;background:#FAF7F2;padding:12px 24px 20px;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
        <a href="{{ item.href }}" style="font-family:'Karla',sans-serif;font-size:17px;font-weight:{{ item.weight }};color:{{ item.color }};text-decoration:none;padding:13px 14px;border-radius:10px;background:{{ item.bg }}" style-hover="color:#C0452B">{{ item.label }}</a>
      </sc-for>
      <a href="contribuicoes.html" style="font-family:'Karla',sans-serif;font-size:17px;font-weight:700;color:#FFFFFF;background:#C0452B;text-decoration:none;padding:14px 24px;border-radius:999px;text-align:center;margin-top:10px" style-hover="background:#A63A23">Contribuir</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;90px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;instituicao&quot;,&quot;documentos&quot;,&quot;contribuicoes&quot;,&quot;contatos&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;breakpoint&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1024,&quot;min&quot;:600,&quot;max&quot;:1200,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Menu móvel&quot;}}">
class Component extends DCLogic {
  state = { open: false, width: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() {
    this._onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const active = this.props.active ?? '';
    const breakpoint = this.props.breakpoint ?? 1024;
    const isMobile = this.state.width < breakpoint;
    const open = this.state.open;
    const items = [
      { label: 'Início', href: 'index.html', key: 'inicio' },
      { label: 'Instituição', href: 'instituicao.html', key: 'instituicao' },
      { label: 'Documentos', href: 'documentos.html', key: 'documentos' },
      { label: 'Contribuições', href: 'contribuicoes.html', key: 'contribuicoes' },
      { label: 'Contatos', href: 'contatos.html', key: 'contatos' }
    ].map(it => ({
      ...it,
      color: it.key === active ? '#C0452B' : '#2E2A26',
      weight: it.key === active ? 700 : 500,
      bg: it.key === active ? '#F3E9DF' : 'transparent'
    }));
    return {
      navItems: items,
      isMobile: isMobile,
      isDesktop: !isMobile,
      menuVisible: isMobile && open,
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      bar1Transform: open ? 'translateY(7px) rotate(45deg)' : 'none',
      bar2Opacity: open ? 0 : 1,
      bar3Transform: open ? 'translateY(-7px) rotate(-45deg)' : 'none'
    };
  }
}
</script>
</body>
</html>
